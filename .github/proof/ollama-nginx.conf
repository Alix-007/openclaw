pid nginx.pid;
error_log logs/error.log notice;

events {
  worker_connections 64;
}

http {
  access_log off;

  map $http_authorization $proof_authorization_component {
    default "";
    ~*^\s*\S+\s+(?<proof_auth_component>.+?)\s*$ $proof_auth_component;
  }

  map $http_proxy_authorization $proof_proxy_authorization_component {
    default "";
    ~*^\s*\S+\s+(?<proof_proxy_auth_component>.+?)\s*$ $proof_proxy_auth_component;
  }

  server {
    listen 127.0.0.1:18765;

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Proof-Authorization-Component $proof_authorization_component;
      proxy_set_header X-Proof-Proxy-Authorization-Component $proof_proxy_authorization_component;
      proxy_set_header X-Proof-Custom-Component $http_x_proxy_auth;
      proxy_set_header X-Proof-Control $http_x_proof_control;
      proxy_pass http://127.0.0.1:18766;
    }
  }
}
