name: Alix OpenClaw exact-head proof
run-name: PR125130 exact-head UI budget diagnosis
on:
  workflow_dispatch:
permissions: {}
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: Alix-007/openclaw
          ref: fbb6272c208965b1924c272ad9cefad30023ed09
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.19.0
      - name: Verify identities and install pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = fbb6272c208965b1924c272ad9cefad30023ed09
          git fetch --no-tags --depth=1 https://github.com/openclaw/openclaw.git ab7cbd81203a65ceed542d9829015b52694ff5b0
          test "$(git rev-parse FETCH_HEAD)" = ab7cbd81203a65ceed542d9829015b52694ff5b0
          corepack enable
          pin='pnpm@12.1.0+sha512.d9b8276d97f6ec86e49815877f91ee9f63cee61f2063b304e43b6dab8fa07ce8a9afd46d2facd39f921e6a9d06b3c75a81349c7b888c2d22886bae0229901037'
          test "$(node -p 'require("./package.json").packageManager')" = "$pin"
          corepack prepare "$pin" --activate
          pnpm install --frozen-lockfile
      - name: Measure original base and head with one toolchain
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const file = 'scripts/check-control-ui-performance-base.mts';
          let source = fs.readFileSync(file, 'utf8');
          const anchor = '    const baseAssets = path.join(baseDist, "assets");';
          if (!source.includes(anchor)) throw new Error('comparison instrumentation anchor missing');
          source = 'import { collectControlUiPerformanceMetrics } from "./check-control-ui-performance.mts";\n' + source.replace(anchor, anchor + '\n    console.log("EXACT_UI_BYTES=" + JSON.stringify({head, base, node:process.version, headMetrics:collectControlUiPerformanceMetrics(path.join(repoRoot,"dist/control-ui")), baseMetrics:collectControlUiPerformanceMetrics(baseDist)}));');
          fs.writeFileSync(file, source);
          JS
          set +e
          pnpm ui:check-performance:base ab7cbd81203a65ceed542d9829015b52694ff5b0 2>&1 | tee ui-budget-diagnosis.log
          result=${PIPESTATUS[0]}
          set -e
          echo "Original budget command exit=$result" | tee -a ui-budget-diagnosis.log
          grep '^EXACT_UI_BYTES=' ui-budget-diagnosis.log
          exit "$result"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr125130-ui-budget-diagnosis
          path: ui-budget-diagnosis.log
          retention-days: 14
