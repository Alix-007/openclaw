name: Alix Apple archive exact-head proof

run-name: apple-archive-${{ inputs.expected }} proof at ${{ inputs.target_sha }}

on:
  workflow_dispatch:
    inputs:
      expected:
        description: Expected result for the unchanged focused test entry
        required: true
        type: choice
        options:
          - red
          - green
      target_sha:
        description: Immutable full SHA from the Alix fork
        required: true
        type: string

permissions: {}

jobs:
  proof:
    name: Apple active-session archive ${{ inputs.expected }} proof
    runs-on: macos-26
    timeout-minutes: 30
    env:
      EXPECTED: ${{ inputs.expected }}
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - name: Check out immutable Alix source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: Alix-007/openclaw
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable source and toolchain
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$actual_sha" != "$TARGET_SHA" ]]; then
            echo "target SHA mismatch: expected=$TARGET_SHA actual=$actual_sha" >&2
            exit 1
          fi
          {
            echo "expected=$EXPECTED"
            echo "target_sha=$actual_sha"
            echo "repository=Alix-007/openclaw"
            echo "runner_os=$RUNNER_OS"
            sw_vers
            xcodebuild -version
            swift --version
          } | tee proof-metadata.txt

      - name: Run unchanged focused Swift entry
        shell: bash
        run: |
          set -uo pipefail
          set +e
          swift test \
            --package-path apps/shared/OpenClawKit \
            --filter ChatSessionSidebarModelTests \
            --no-parallel \
            2>&1 | tee proof-apple-archive-${EXPECTED}.log
          test_status=${PIPESTATUS[0]}
          set -e

          if [[ "$EXPECTED" == "red" ]]; then
            if [[ "$test_status" -eq 0 ]]; then
              echo "expected current-main acceptance-red, but focused tests passed" >&2
              exit 1
            fi
            grep -F 'active sessions remain archivable for gateway drain' \
              proof-apple-archive-red.log
            marker='[apple archive acceptance-red] exact-head=true focused-entry=ChatSessionSidebarModelTests active-session-archive=false'
          else
            if [[ "$test_status" -ne 0 ]]; then
              echo "expected acceptance-green, but focused tests failed" >&2
              exit "$test_status"
            fi
            marker='[apple archive acceptance-green] exact-head=true focused-entry=ChatSessionSidebarModelTests active-session-archive=true controls=main-global-missing-id-rejected'
          fi

          echo "$marker" | tee -a proof-apple-archive-${EXPECTED}.log proof-metadata.txt

      - name: Upload proof receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apple-archive-${{ inputs.expected }}-${{ inputs.target_sha }}
          path: |
            proof-metadata.txt
            proof-apple-archive-${{ inputs.expected }}.log
          if-no-files-found: warn
          retention-days: 30
