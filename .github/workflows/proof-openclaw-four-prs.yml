name: Alix OpenClaw exact-head proof
run-name: PR132559 merged-main focused validation
on:
  workflow_dispatch:
permissions: {}
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: Alix-007/openclaw
          ref: 5f2f576534793ee4da04f52307be9504f85e62ae
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.19.0
      - name: Verify source and pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 5f2f576534793ee4da04f52307be9504f85e62ae
          git log -1 --format='%H %P'
          pin='pnpm@12.3.4+sha512.961aa41fb077da3a04a441d9f8e15ebc0c96da8ef710b2eb67bf9ee7cb0610eabd48f1fd85f51cffe73846785fa0f87c56a3a872a1d893f8446741b5cce45457'
          test "$(node -p 'require("./package.json").packageManager')" = "$pin"
          corepack enable
          corepack prepare "$pin" --activate
          pnpm install --frozen-lockfile
      - name: Four focused files
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-vitest.mjs src/agents/tools/image-tool.test.ts src/media-understanding/image.runtime-timeout.test.ts src/media-understanding/image.test.ts extensions/codex/src/app-server/dynamic-tool-execution.test.ts --reporter=verbose 2>&1 | tee focused.log
      - name: Documentation discovery and migrated MDX pages
        shell: bash
        run: |
          set -euo pipefail
          pnpm docs:list > docs-list.log
          node scripts/check-docs-mdx.mjs docs/gateway/config-tools/built-in-tools.md docs/plugins/codex-harness-reference/timeouts.md 2>&1 | tee docs-mdx.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr132559-merged-main-validation
          path: |
            focused.log
            docs-list.log
            docs-mdx.log
          retention-days: 14
