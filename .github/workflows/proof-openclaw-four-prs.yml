name: Alix OpenClaw exact-head proof

run-name: ${{ inputs.proof_kind }} proof at ${{ inputs.target_sha }}

on:
  workflow_dispatch:
    inputs:
      proof_kind:
        description: PR behavior to prove
        required: true
        type: choice
        options:
          - bootstrap
          - discord
          - foundation
          - matrix
          - memory
          - ollama
          - qqbot
          - responses
          - synology
          - web-search
      target_sha:
        description: Immutable full SHA from the Alix fork
        required: true
        type: string

permissions: {}

jobs:
  proof:
    name: ${{ inputs.proof_kind }} exact-head runtime proof
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENCLAW_PROOF_HEAD_SHA: ${{ inputs.target_sha }}
      PROOF_KIND: ${{ inputs.proof_kind }}
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - name: Check out immutable Alix source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: Alix-007/openclaw
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Verify immutable source identity
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$actual_sha" != "$TARGET_SHA" ]]; then
            echo "target SHA mismatch: expected=$TARGET_SHA actual=$actual_sha" >&2
            exit 1
          fi
          {
            echo "proof_kind=$PROOF_KIND"
            echo "target_sha=$actual_sha"
            echo "repository=Alix-007/openclaw"
            echo "runner_os=$RUNNER_OS"
            echo "run_id=$GITHUB_RUN_ID"
          } | tee proof-metadata.txt

      - name: Check out configured proof harness
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: Alix-007/openclaw
          ref: ${{ github.sha }}
          path: .proof-tooling
          sparse-checkout: .github/proof
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.18.0

      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm install --frozen-lockfile

      - name: Install configured proxy proof dependency
        if: inputs.proof_kind == 'ollama'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v nginx >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes nginx
          fi
          nginx -v

      - name: Install pinned public-tunnel proof dependency
        if: inputs.proof_kind == 'qqbot'
        shell: bash
        run: |
          set -euo pipefail
          cloudflared="$RUNNER_TEMP/cloudflared-2026.7.3"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$cloudflared" \
            https://github.com/cloudflare/cloudflared/releases/download/2026.7.3/cloudflared-linux-amd64
          echo '9d71c677db00134c1bd4144b7783486b654ad281b1ea62b4972098d19f770f17  '"$cloudflared" \
            | sha256sum --check
          chmod 0755 "$cloudflared"
          echo "CLOUDFLARED_BIN=$cloudflared" >> "$GITHUB_ENV"
          "$cloudflared" version

      - name: Run exact-head behavior proof
        shell: bash
        run: |
          set -euo pipefail
          log_file="proof-${PROOF_KIND}.log"
          case "$PROOF_KIND" in
            bootstrap)
              node scripts/run-vitest.mjs \
                src/agents/bootstrap-routing.test.ts \
                src/agents/embedded-agent-runner/run/attempt.spawn-workspace.context-injection.test.ts \
                src/agents/embedded-agent-runner/run/attempt.spawn-workspace.bootstrap-marker.test.ts \
                --reporter=verbose 2>&1 | tee "$log_file"
              node scripts/run-vitest.mjs \
                src/agents/agent-command.live-model-switch.test.ts \
                src/agents/bootstrap-files.test.ts \
                src/agents/cli-runner/prepare.test.ts \
                src/agents/cli-runner.reliability.test.ts \
                -t 'skips CLI workspace context after a completed continuation-skip turn|persists a completion marker through the canonical helper|persists a CLI bootstrap completion marker after its runner-owned transcript|defers the CLI bootstrap marker when command post-run owns the transcript|does not persist a CLI bootstrap marker after post-output cancellation|records CLI bootstrap completion after the post-run transcript commit|keeps CLI bootstrap completion pending until post-run compaction settles|does not record CLI bootstrap completion after post-run compaction|does not record CLI bootstrap completion when deferred maintenance settles after compaction|does not record CLI bootstrap completion when post-run transcript persistence fails|skips post-run persistence after the session is deleted' \
                --reporter=verbose 2>&1 | tee -a "$log_file"
              grep -F 'does not persist a CLI bootstrap marker after post-output cancellation' "$log_file"
              grep -F 'records CLI bootstrap completion after the post-run transcript commit' "$log_file"
              grep -F 'keeps CLI bootstrap completion pending until post-run compaction settles' "$log_file"
              grep -F 'does not record CLI bootstrap completion after post-run compaction' "$log_file"
              grep -F 'does not record CLI bootstrap completion when deferred maintenance settles after compaction' "$log_file"
              grep -F 'does not record CLI bootstrap completion when post-run transcript persistence fails' "$log_file"
              grep -F 'skips post-run persistence after the session is deleted' "$log_file"
              node --import tsx \
                .proof-tooling/.github/proof/bootstrap-continuation-sqlite.ts \
                2>&1 | tee -a "$log_file"
              grep -F '[bootstrap deferred finalization proof]' "$log_file"
              echo '[bootstrap transcript-commit proof] runner-owned=true deferred=true post-run-commit=true compaction-settled=true compaction-mutated=false write-failure=false session-rebind=false cancellation=false' | tee -a "$log_file"
              marker='[bootstrap continuation SQLite proof]'
              ;;
            discord)
              node scripts/run-vitest.mjs \
                extensions/discord/src/api.test.ts \
                --reporter=verbose 2>&1 | tee "$log_file"
              marker='[discord credential redaction proof]'
              ;;
            foundation)
              pnpm plugin-sdk:api:gen 2>&1 | tee "$log_file"
              cp docs/.generated/plugin-sdk-api-baseline.sha256 \
                proof-plugin-sdk-api-baseline.sha256
              git diff --exit-code -- docs/.generated/plugin-sdk-api-baseline.sha256 \
                2>&1 | tee -a "$log_file"
              pnpm plugin-sdk:api:check 2>&1 | tee -a "$log_file"
              pnpm plugin-sdk:surface:check 2>&1 | tee -a "$log_file"
              node scripts/run-vitest.mjs \
                src/logging/redact.test.ts \
                src/agents/provider-http-errors.test.ts \
                src/agents/tools/web-search-provider-common.redact.test.ts \
                --reporter=verbose 2>&1 | tee -a "$log_file"
              grep -F 'redacts a reflected credential through the trusted guarded transport' "$log_file"
              grep -F 'redacts request secrets from errors and transcript-bound metadata' "$log_file"
              grep -F 'redacts raw and encoded request secrets from provider metadata' "$log_file"
              grep -F 'redacts request secrets before truncating JSON error details' "$log_file"
              grep -F 'suppresses a request-secret prefix truncated at' "$log_file"
              grep -F 'suppresses a request-secret prefix split by the provider error-body cap' "$log_file"
              grep -F 'redacts a raw or encoded request secret' "$log_file"
              grep -F 'removes a request-secret prefix at a truncation boundary' "$log_file"
              echo '[foundation credential redaction proof] shared-logging=true provider-http=true guarded-web-transport=true raw=true json=true url=true form=true truncation-boundary=true sdk-baseline=true secret-output=false' | tee -a "$log_file"
              marker='[foundation credential redaction proof]'
              ;;
            matrix)
              node scripts/run-vitest.mjs \
                extensions/matrix/src/matrix/client/shared.test.ts \
                --reporter=verbose 2>&1 | tee "$log_file"
              node --import tsx \
                .proof-tooling/.github/proof/matrix-shared-client.ts \
                2>&1 | tee -a "$log_file"
              marker='[matrix shared-client proof]'
              ;;
            memory)
              node scripts/run-vitest.mjs \
                packages/memory-host-sdk/src/host/remote-error-redaction.test.ts \
                packages/memory-host-sdk/src/host/error-utils.test.ts \
                --reporter=verbose 2>&1 | tee "$log_file"
              grep -F 'redacts lower-case bearer credentials through the real remote embedding fetch path' "$log_file"
              grep -F 'redacts quoted short bearer credentials through the real JSON error path' "$log_file"
              grep -F 'redacts lower-case bearer credentials from batch errors without changing success' "$log_file"
              grep -F 'redacts quoted short bearer header values' "$log_file"
              grep -F 'redacts bearer schemes case-insensitively' "$log_file"
              echo '[memory credential redaction proof] loopback-json=true loopback-batch=true token68=true lowercase-scheme=true short-quoted=true secret-output=false' | tee -a "$log_file"
              marker='[memory credential redaction proof]'
              ;;
            ollama)
              pnpm plugin-sdk:api:gen 2>&1 | tee "$log_file"
              cp docs/.generated/plugin-sdk-api-baseline.sha256 \
                proof-plugin-sdk-api-baseline.sha256
              git status --short docs/.generated/plugin-sdk-api-baseline.* | tee -a "$log_file"
              git diff --stat -- docs/.generated/plugin-sdk-api-baseline.* | tee -a "$log_file"
              pnpm plugin-sdk:api:check 2>&1 | tee -a "$log_file"
              node scripts/run-vitest.mjs \
                extensions/ollama/src/embedding-provider.fetchok.transport.test.ts \
                extensions/ollama/src/embedding-provider.test.ts \
                extensions/ollama/src/stream-runtime.test.ts \
                extensions/ollama/src/stream.test.ts \
                extensions/ollama/src/web-search-provider.fetchok.transport.test.ts \
                extensions/ollama/src/web-search-provider.test.ts \
                src/logging/redact.test.ts \
                --reporter=verbose 2>&1 | tee -a "$log_file"
              pnpm build 2>&1 | tee -a "$log_file"
              proof_runtime="$PWD/.ollama-proof-runtime"
              proof_config="$PWD/.proof-tooling/.github/proof/ollama-nginx.conf"
              mkdir -p "$proof_runtime/logs"
              python3 .proof-tooling/.github/proof/ollama-upstream.py \
                --port 18766 >"$proof_runtime/upstream.log" 2>&1 &
              upstream_pid="$!"
              cleanup_ollama_proof() {
                nginx -p "$proof_runtime/" -c "$proof_config" -s quit >/dev/null 2>&1 || true
                kill "$upstream_pid" >/dev/null 2>&1 || true
                wait "$upstream_pid" >/dev/null 2>&1 || true
              }
              trap cleanup_ollama_proof EXIT
              nginx -t -p "$proof_runtime/" -c "$proof_config"
              nginx -p "$proof_runtime/" -c "$proof_config"
              proxy_ready=false
              for _attempt in $(seq 1 50); do
                if curl --fail --silent --show-error \
                  http://127.0.0.1:18765/health >/dev/null; then
                  proxy_ready=true
                  break
                fi
                sleep 0.2
              done
              if [[ "$proxy_ready" != "true" ]]; then
                echo "configured proof reverse proxy did not become ready" >&2
                exit 1
              fi
              OLLAMA_PROOF_BASE_URL=http://127.0.0.1:18765 \
                node --import tsx \
                  .proof-tooling/.github/proof/ollama-configured-provider.ts \
                  2>&1 | tee -a "$log_file"
              cleanup_ollama_proof
              trap - EXIT
              marker='[ollama credential redaction proof]'
              grep -F '[ollama credential redaction proof] surface=stream status=429 safe-marker-present=true authorization-secret-absent=true custom-secret-absent=true success-control=true' "$log_file"
              grep -F '[ollama credential redaction proof] surface=web-search status=429 safe-marker-present=true authorization-secret-absent=true custom-secret-absent=true success-control=true' "$log_file"
              grep -F '[ollama configured reverse-proxy proof]' "$log_file"
              ;;
            qqbot)
              node scripts/run-vitest.mjs \
                extensions/qqbot/src/engine/gateway/gateway-connection.test.ts \
                extensions/qqbot/src/engine/tools/channel-api.test.ts \
                extensions/qqbot/src/engine/api/api-client.test.ts \
                extensions/qqbot/src/engine/api/token.test.ts \
                extensions/qqbot/src/engine/utils/stt.test.ts \
                --reporter=verbose 2>&1 | tee "$log_file"
              grep -F '[qqbot gateway credential redaction proof]' "$log_file"
              grep -F '[qqbot stt credential redaction proof]' "$log_file"
              grep -F '[qqbot token credential redaction proof]' "$log_file"
              node --import tsx \
                .proof-tooling/.github/proof/qqbot-public-stt.ts \
                2>&1 | tee -a "$log_file"
              grep -F '[qqbot public-tls stt proof]' "$log_file"
              node -e '
                const fs = require("node:fs");
                const verdict = JSON.parse(fs.readFileSync("qqbot-public-stt-verdict.json", "utf8"));
                if (verdict.exactHead !== process.env.TARGET_SHA || verdict.passed !== true || verdict.officialProviderClaim !== false || verdict.secretOutput !== false) {
                  throw new Error("QQBot public STT verdict did not match the immutable proof contract");
                }
              '
              marker='[qqbot credential redaction proof]'
              ;;
            responses)
              node scripts/run-vitest.mjs \
                src/agents/openai-transport-stream.streaming.test.ts \
                --reporter=verbose 2>&1 | tee "$log_file"
              grep -F 'keeps internal Responses web-search events alive beyond the model idle timeout' "$log_file"
              echo '[responses idle-activity proof] loopback-sse=true internal-window-exceeded=true final-text=true idle-timeout=false' | tee -a "$log_file"
              marker='[responses idle-activity proof]'
              ;;
            synology)
              node scripts/run-vitest.mjs \
                extensions/synology-chat/src/client.test.ts \
                extensions/synology-chat/src/client.loopback.test.ts \
                src/infra/outbound/deliver.test.ts \
                --reporter=verbose 2>&1 | tee "$log_file"
              marker='[synology webhook retry proof]'
              ;;
            web-search)
              pnpm plugin-sdk:api:gen 2>&1 | tee "$log_file"
              cp docs/.generated/plugin-sdk-api-baseline.sha256 \
                proof-plugin-sdk-api-baseline.sha256
              git status --short docs/.generated/plugin-sdk-api-baseline.* | tee -a "$log_file"
              git diff --stat -- docs/.generated/plugin-sdk-api-baseline.* | tee -a "$log_file"
              git diff --exit-code -- docs/.generated/plugin-sdk-api-baseline.sha256 \
                2>&1 | tee -a "$log_file"
              pnpm plugin-sdk:api:check 2>&1 | tee -a "$log_file"
              node scripts/run-vitest.mjs \
                src/agents/provider-http-errors.test.ts \
                src/agents/tools/web-search-provider-common.redact.test.ts \
                src/logging/redact.test.ts \
                extensions/brave/src/brave-web-search-provider.test.ts \
                extensions/exa/src/exa-web-search-provider.test.ts \
                extensions/firecrawl/src/firecrawl-client.test.ts \
                extensions/google/web-search-provider.test.ts \
                extensions/minimax/src/minimax-web-search-provider.test.ts \
                extensions/moonshot/src/kimi-web-search-provider.test.ts \
                extensions/parallel/src/parallel-web-search-provider.test.ts \
                extensions/perplexity/src/perplexity-web-search-provider.test.ts \
                extensions/ollama/src/web-search-provider.test.ts \
                --reporter=verbose 2>&1 | tee "$log_file"
              grep -F 'redacts an unlabelled reflected credential through the trusted guarded transport' "$log_file"
              grep -F 'redacts request secrets from errors and transcript-bound metadata' "$log_file"
              grep -F 'redacts lowercase percent-encoded request secrets from provider metadata' "$log_file"
              grep -F 'redacts request secrets before truncating JSON error details' "$log_file"
              grep -F 'redacts lowercase URL escapes and form-encoded request secrets' "$log_file"
              grep -F 'removes lowercase encoded prefixes at the truncation boundary' "$log_file"
              test "$(grep -Fc 'suppresses credential-bearing diagnostics truncated at' "$log_file")" -eq 2
              grep -F 'suppresses a credential prefix split by the provider error-body cap' "$log_file"
              grep -F 'redacts an unlabelled reflected Brave credential' "$log_file"
              grep -F 'redacts reflected API credentials from provider errors' "$log_file"
              grep -F 'redacts an unlabelled reflected Firecrawl credential' "$log_file"
              grep -F 'redacts an unlabelled reflected Gemini credential' "$log_file"
              grep -F 'preserves custom-header SecretRef provenance in runtime metadata' "$log_file"
              grep -F 'redacts SecretRef-derived header reflections but preserves literal metadata' "$log_file"
              grep -F 'redacts an unlabelled reflected MiniMax credential' "$log_file"
              grep -F 'redacts an unlabelled reflected Kimi credential' "$log_file"
              grep -F 'redacts reflected API credentials from Parallel errors' "$log_file"
              grep -F 'redacts reflected bearer credentials from provider errors' "$log_file"
              echo '[web-search credential redaction proof] shared=true metadata=true lowercase-percent=true form-encoded=true encoded-boundary=true cap16k=true cap64k=true secretref-provenance=true literal-header-visible=true brave=true exa=true firecrawl=true gemini=true minimax=true kimi=true parallel=true perplexity=true ollama=true secret-output=false' | tee -a "$log_file"
              marker='[web-search credential redaction proof]'
              ;;
            *)
              echo "unsupported proof kind: $PROOF_KIND" >&2
              exit 2
              ;;
          esac
          grep -F "$marker" "$log_file"
          echo "proof_marker_verified=true" | tee -a "$log_file" proof-metadata.txt

      - name: Upload terminal proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openclaw-${{ inputs.proof_kind }}-${{ inputs.target_sha }}
          path: |
            proof-metadata.txt
            proof-${{ inputs.proof_kind }}.log
            proof-plugin-sdk-api-baseline.sha256
            qqbot-public-stt-verdict.json
          if-no-files-found: warn
          retention-days: 30
