name: PR 125201 session preview real Gateway proof

on:
  push:
    branches: [alix/proof-125201]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  EXPECTED_HEAD: bd69181013ac983d934da5945825cf0b9335be3e

jobs:
  real-sqlite-gateway-rpc-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bind the harness to the exact pull request head
        run: |
          set -euo pipefail
          cp test/pr125201-session-preview-real-gateway-proof.e2e.test.ts "$RUNNER_TEMP/"
          git checkout --detach "$EXPECTED_HEAD"
          cp "$RUNNER_TEMP/pr125201-session-preview-real-gateway-proof.e2e.test.ts" test/
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Run real SQLite and authenticated Gateway RPC proof
        env:
          OPENCLAW_VITEST_MAX_WORKERS: "1"
          OPENCLAW_VITEST_NO_OUTPUT_TIMEOUT_MS: "660000"
        run: |
          set -euo pipefail
          mkdir -p .local/pr125201-proof
          node scripts/run-vitest.mjs test/pr125201-session-preview-real-gateway-proof.e2e.test.ts \
            2>&1 | tee .local/pr125201-proof/run.log
          sha256sum \
            .local/pr125201-proof/result.json \
            .local/pr125201-proof/rpc-responses.json \
            .local/pr125201-proof/run.log \
            > .local/pr125201-proof/SHA256SUMS

      - name: Upload proof artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr125201-session-preview-real-gateway-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/pr125201-proof
          include-hidden-files: true
          if-no-files-found: error
