name: PR 101923 media-understanding resize proof

run-name: PR 101923 proof at ${{ inputs.product_sha }}

on:
  workflow_dispatch:
    inputs:
      product_sha:
        description: Immutable full product SHA from the Alix fork
        required: true
        type: string
      harness_sha:
        description: Immutable full proof-harness SHA from the Alix fork
        required: true
        type: string

permissions: {}

jobs:
  exact-head-proof:
    name: Exact-head configured and explicit fallback proof
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PRODUCT_SHA: ${{ inputs.product_sha }}
      HARNESS_SHA: ${{ inputs.harness_sha }}
    steps:
      - name: Check out immutable product source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: Alix-007/openclaw
          ref: ${{ inputs.product_sha }}
          persist-credentials: false

      - name: Check out immutable proof harness
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: Alix-007/openclaw
          ref: ${{ inputs.harness_sha }}
          path: .proof-tooling
          sparse-checkout: .github/proof
          persist-credentials: false

      - name: Verify immutable source identities
        shell: bash
        env:
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_product_sha="$(git rev-parse HEAD)"
          actual_harness_sha="$(git -C .proof-tooling rev-parse HEAD)"
          if [[ ! "$PRODUCT_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             [[ ! "$HARNESS_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             [[ "$actual_product_sha" != "$PRODUCT_SHA" ]] ||
             [[ "$actual_harness_sha" != "$HARNESS_SHA" ]] ||
             [[ "$DISPATCH_SHA" != "$HARNESS_SHA" ]]; then
            echo "immutable SHA mismatch" >&2
            echo "product expected=$PRODUCT_SHA actual=$actual_product_sha" >&2
            echo "harness expected=$HARNESS_SHA actual=$actual_harness_sha dispatch=$DISPATCH_SHA" >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.18.0

      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm install --frozen-lockfile

      - name: Check formatting across complete PR TypeScript delta
        shell: bash
        run: |
          set -euo pipefail
          pnpm format:check src/agents/image-compression-policy.ts src/agents/tools/image-tool.ts src/media-understanding/apply.test.ts src/media-understanding/image-input-normalize.test.ts src/media-understanding/image-input-normalize.ts src/media-understanding/runner.entries.image-resize.test.ts src/media-understanding/runner.entries.ts src/media-understanding/runner.vision-skip.test.ts src/media-understanding/runtime.audio-input-budget.test.ts src/media-understanding/runtime.test.ts src/media-understanding/runtime.ts src/media/image-ops.rastermill-adapter.test.ts src/media/image-ops.ts src/media/image-optimization-error.ts src/media/image-processor.ts src/media/web-media.ts
