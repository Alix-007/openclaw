name: P02 APNs environment packet proof

run-name: P02 proof at ${{ inputs.product_sha }}

on:
  workflow_dispatch:
    inputs:
      product_sha:
        description: Immutable full product SHA from the Alix fork
        required: true
        type: string
      harness_sha:
        description: Immutable full proof-harness SHA from the Alix fork
        required: true
        type: string

      phase:
        description: Baseline reproduction or supplied packet checks
        required: true
        type: choice
        options:
          - baseline
          - green
          - focused

permissions: {}

jobs:
  exact-head-proof:
    name: Exact-head configured and explicit fallback proof
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PRODUCT_SHA: ${{ inputs.product_sha }}
      HARNESS_SHA: ${{ inputs.harness_sha }}
    steps:
      - name: Check out immutable product source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: Alix-007/openclaw
          ref: ${{ inputs.product_sha }}
          persist-credentials: false

      - name: Check out immutable proof harness
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: Alix-007/openclaw
          ref: ${{ inputs.harness_sha }}
          path: .proof-tooling
          sparse-checkout: .github/proof/p02-packet
          persist-credentials: false

      - name: Verify immutable source identities
        shell: bash
        env:
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_product_sha="$(git rev-parse HEAD)"
          actual_harness_sha="$(git -C .proof-tooling rev-parse HEAD)"
          if [[ ! "$PRODUCT_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             [[ ! "$HARNESS_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             [[ "$actual_product_sha" != "$PRODUCT_SHA" ]] ||
             [[ "$actual_harness_sha" != "$HARNESS_SHA" ]] ||
             [[ "$DISPATCH_SHA" != "$HARNESS_SHA" ]]; then
            echo "immutable SHA mismatch" >&2
            echo "product expected=$PRODUCT_SHA actual=$actual_product_sha" >&2
            echo "harness expected=$HARNESS_SHA actual=$actual_harness_sha dispatch=$DISPATCH_SHA" >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.18.0

      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm install --frozen-lockfile

      - name: Baseline registered command reproduction
        if: inputs.phase == 'baseline'
        run: node scripts/run-vitest.mjs run src/cli/nodes-cli/register.push.test.ts

      - name: Supplied packet checks
        if: inputs.phase == 'green'
        run: |
          git fetch origin 872cb0a3613d3541d3bb7f4b263a7d49c99efc54 --depth=1
          mkdir -p .proof-tooling/.github/proof/p02-packet/evidence
          bash .proof-tooling/.github/proof/p02-packet/scripts/check.sh "$GITHUB_WORKSPACE" P02

      - name: Final exact-head focused confirmation
        if: inputs.phase == 'focused'
        run: |
          set -euo pipefail
          pnpm exec oxfmt --check src/cli/nodes-cli/register.push.ts src/cli/nodes-cli/register.push.test.ts
          node scripts/run-vitest.mjs run src/cli/nodes-cli/register.push.test.ts
          git diff --exit-code

      - name: Upload packet check evidence
        if: always() && inputs.phase == 'green'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p02-check-evidence
          path: .proof-tooling/.github/proof/p02-packet/evidence
          include-hidden-files: true
          if-no-files-found: error
