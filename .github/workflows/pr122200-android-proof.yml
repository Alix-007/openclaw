name: PR 122200 Android interaction proof

on:
  push:
    branches:
      - proof/pr122200-android-4d-kvm

permissions: {}

concurrency:
  group: pr122200-android-proof
  cancel-in-progress: true

jobs:
  android-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PRODUCT_SHA: bbfdfdcdcc507267df04ecc38ffc51c435609150
      GATEWAY_VERSION: 2026.7.1-2
      GATEWAY_PORT: "18791"
      MOCK_PORT: "18881"
      PROOF_TOKEN: pr122200proof
      PROOF_API_KEY: proof-dummy-key
      AVD_NAME: pr122200
      SYSTEM_IMAGE: system-images;android-35;google_apis;x86_64

    steps:
      - name: Check out exact product head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.PRODUCT_SHA }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up repository toolchain
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.x"
          install-bun: "false"
          install-deps: "true"
          use-actions-cache: "false"

      - name: Build exact-head Android APK
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          cd apps/android
          ./gradlew --no-daemon :app:assemblePlayDebug

      - name: Exercise released Gateway in a real emulator
        id: proof
        shell: bash
        run: |
          set -euo pipefail

          artifact_dir="$RUNNER_TEMP/pr122200-artifacts"
          state_dir="$RUNNER_TEMP/pr122200-state"
          workspace_dir="$RUNNER_TEMP/pr122200-workspace"
          mkdir -p "$artifact_dir" "$state_dir" "$workspace_dir"
          export ARTIFACT_DIR="$artifact_dir"
          export OPENCLAW_STATE_DIR="$state_dir"
          export OPENCLAW_CONFIG_PATH="$state_dir/openclaw.json"
          export OPENAI_API_KEY="$PROOF_API_KEY"
          export OPENCLAW_GATEWAY_TOKEN="$PROOF_TOKEN"
          export OPENCLAW_DISABLE_BONJOUR=1

          emulator_pid=""
          gateway_pid=""
          mock_pid=""
          screenrecord_pid=""
          session_label_redacted=false
          transcript_path=""
          transcript_backup=""

          phase() {
            printf '%s %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$1" >>"$ARTIFACT_DIR/phase.log"
            echo "::notice title=PR 122200 proof phase::$1"
          }

          redact_file() {
            local source="$1"
            local target="$2"
            if [[ -f "$source" ]]; then
              sed \
                -e "s/${PROOF_TOKEN}/[REDACTED]/g" \
                -e "s/${PROOF_API_KEY}/[REDACTED]/g" \
                -E -e 's/("(token|publicKey|deviceId|nodeId|requestId)"[[:space:]]*:[[:space:]]*)"[^"]*"/\1"[REDACTED]"/g' \
                -E -e 's/((device|node|deviceId|nodeId|requestId|publicKey|token|conn|id)=)[^[:space:]]+/\1[REDACTED]/g' \
                -E -e 's/(Sending adb public key ).*/\1[REDACTED]/g' \
                -E -e 's/(androidboot\.qemu\.adb\.pubkey=)[^[:space:]]+/\1[REDACTED]/g' \
                -E -e 's/(androidboot\.vbmeta\.digest=)[^[:space:]]+/\1[REDACTED]/g' \
                -E -e 's/[[:xdigit:]]{8}-[[:xdigit:]-]{27,}/[ID]/g' \
                -E -e 's/[[:xdigit:]]{16,}/[ID]/g' \
                -E -e 's/(OpenClaw App[^"<]* · )[^"<]*/\1[ID]/g' \
                "$source" >"$target"
            fi
          }

          append_pairing_log() {
            local label="$1"
            local source="$2"
            printf '%s %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$label" >>"$RUNNER_TEMP/pairing-orchestration-raw.log"
            if [[ -s "$source" ]]; then
              sed \
                -e "s/${PROOF_TOKEN}/[REDACTED]/g" \
                -e "s/${PROOF_API_KEY}/[REDACTED]/g" \
                -E -e 's/("(token|publicKey|deviceId|nodeId|requestId)"[[:space:]]*:[[:space:]]*)"[^"]*"/\1"[REDACTED]"/g' \
                -E -e 's/((device|node|deviceId|nodeId|requestId|publicKey|token|conn|id)=)[^[:space:]]+/\1[REDACTED]/g' \
                -E -e 's/[[:xdigit:]]{8}-[[:xdigit:]-]{27,}/[ID]/g' \
                -E -e 's/[[:xdigit:]]{16,}/[ID]/g' \
                "$source" >>"$RUNNER_TEMP/pairing-orchestration-raw.log"
            fi
          }

          dump_ui() {
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || return 1
            adb exec-out cat /sdcard/window.xml >"$RUNNER_TEMP/window.xml"
          }

          ui_point() {
            local target="$1"
            local mode="${2:-exact}"
            dump_ui || return 1
            TARGET="$target" MATCH_MODE="$mode" node <<'NODE'
          const fs = require("node:fs");
          const xml = fs.readFileSync(process.env.RUNNER_TEMP + "/window.xml", "utf8");
          const target = process.env.TARGET ?? "";
          const exact = process.env.MATCH_MODE !== "contains";
          const decode = (value) =>
            value
              .replaceAll("&quot;", '"')
              .replaceAll("&apos;", "'")
              .replaceAll("&lt;", "<")
              .replaceAll("&gt;", ">")
              .replaceAll("&amp;", "&");
          const attr = (tag, name) => {
            const match = tag.match(new RegExp(`(?:^|\\s)${name}="([^"]*)"`));
            return match ? decode(match[1]) : "";
          };
          const matches = [];
          for (const tag of xml.match(/<node\b[^>]*>/g) ?? []) {
            const labels = [attr(tag, "text"), attr(tag, "content-desc")].filter(Boolean);
            if (!labels.some((label) => (exact ? label === target : label.includes(target)))) continue;
            const bounds = attr(tag, "bounds").match(/^\[(\d+),(\d+)]\[(\d+),(\d+)]$/);
            if (!bounds) continue;
            const [, left, top, right, bottom] = bounds.map(Number);
            matches.push({ x: Math.round((left + right) / 2), y: Math.round((top + bottom) / 2) });
          }
          matches.sort((a, b) => b.y - a.y || a.x - b.x);
          if (!matches.length) process.exit(1);
          process.stdout.write(`${matches[0].x} ${matches[0].y}`);
          NODE
          }

          wait_text() {
            local target="$1"
            local timeout_seconds="${2:-120}"
            local mode="${3:-exact}"
            local deadline=$((SECONDS + timeout_seconds))
            while (( SECONDS < deadline )); do
              if ui_point "$target" "$mode" >/dev/null 2>&1; then
                return 0
              fi
              sleep 2
            done
            dump_ui || true
            redact_file "$RUNNER_TEMP/window.xml" "$ARTIFACT_DIR/timeout-window.xml"
            echo "Timed out waiting for UI text: $target" >&2
            return 1
          }

          tap_text() {
            local target="$1"
            local timeout_seconds="${2:-120}"
            local mode="${3:-exact}"
            wait_text "$target" "$timeout_seconds" "$mode"
            local point
            point="$(ui_point "$target" "$mode")"
            read -r x y <<<"$point"
            adb shell input tap "$x" "$y"
          }

          ensure_chat() {
            local deadline=$((SECONDS + 90))
            while (( SECONDS < deadline )); do
              if ui_point "Message OpenClaw" exact >/dev/null 2>&1; then
                return 0
              fi
              local point
              if point="$(ui_point "Chat" exact)"; then
                local x y
                read -r x y <<<"$point"
                adb shell input tap "$x" "$y"
                phase "dashboard-chat-opened"
              fi
              sleep 2
            done
            wait_text "Message OpenClaw" 5 exact
          }

          type_into() {
            local field="$1"
            local value="$2"
            tap_text "$field" 60 exact
            adb shell input keyevent KEYCODE_MOVE_END
            for _ in $(seq 1 40); do adb shell input keyevent KEYCODE_DEL; done
            adb shell input text "$value"
            adb shell input keyevent KEYCODE_ESCAPE
          }

          screenshot() {
            local name="$1"
            adb exec-out screencap -p >"$ARTIFACT_DIR/$name"
            dump_ui || true
            redact_file "$RUNNER_TEMP/window.xml" "$ARTIFACT_DIR/${name%.png}.xml"
          }

          label_android_session() {
            local sessions_json="$RUNNER_TEMP/sessions-list.json"
            local patch_json="$RUNNER_TEMP/session-label-patch.json"
            openclaw gateway call sessions.list \
              --params '{"includeGlobal":true,"includeUnknown":false,"agentId":"main","limit":100}' \
              --url "ws://127.0.0.1:${GATEWAY_PORT}" \
              --token "$PROOF_TOKEN" \
              --json >"$sessions_json"
            SESSIONS_JSON="$sessions_json" PATCH_JSON="$patch_json" node <<'NODE'
          const fs = require("node:fs");
          const value = JSON.parse(fs.readFileSync(process.env.SESSIONS_JSON, "utf8"));
          const sessions = Array.isArray(value.sessions) ? value.sessions : [];
          const target = sessions.find((session) =>
            typeof session?.key === "string" &&
            typeof session?.label === "string" &&
            session.label.startsWith("OpenClaw App")
          );
          if (!target) process.exit(1);
          fs.writeFileSync(
            process.env.PATCH_JSON,
            JSON.stringify({ key: target.key, agentId: "main", label: "PR 122200 proof" }),
            { mode: 0o600 },
          );
          NODE
            openclaw gateway call sessions.patch \
              --params "$(cat "$patch_json")" \
              --url "ws://127.0.0.1:${GATEWAY_PORT}" \
              --token "$PROOF_TOKEN" \
              --json >"$RUNNER_TEMP/session-label-patch-result.json"
            session_label_redacted=true
            phase "android-session-label-redacted"
          }

          approve_pending_devices() {
            local output="$RUNNER_TEMP/devices.json"
            local stderr="$RUNNER_TEMP/devices.stderr"
            if ! openclaw devices list --json \
              --url "ws://127.0.0.1:${GATEWAY_PORT}" \
              --token "$PROOF_TOKEN" >"$output" 2>"$stderr"; then
              append_pairing_log "devices-list-failed stdout" "$output"
              append_pairing_log "devices-list-failed stderr" "$stderr"
              return 0
            fi
            append_pairing_log "devices-list-ok stdout" "$output"
            append_pairing_log "devices-list-ok stderr" "$stderr"
            DEVICES_JSON="$output" node <<'NODE' | while IFS= read -r request_id; do
          const fs = require("node:fs");
          const text = fs.readFileSync(process.env.DEVICES_JSON, "utf8");
          const start = text.indexOf("{");
          if (start < 0) process.exit(0);
          const value = JSON.parse(text.slice(start));
          for (const pending of value.pending ?? []) {
            if (typeof pending.requestId === "string") console.log(pending.requestId);
          }
          NODE
              phase "device-pairing-request-observed"
              if openclaw devices approve "$request_id" \
                --url "ws://127.0.0.1:${GATEWAY_PORT}" \
                --token "$PROOF_TOKEN" >"$RUNNER_TEMP/device-approve.stdout" 2>"$RUNNER_TEMP/device-approve.stderr"; then
                append_pairing_log "devices-approve-ok stdout" "$RUNNER_TEMP/device-approve.stdout"
                append_pairing_log "devices-approve-ok stderr" "$RUNNER_TEMP/device-approve.stderr"
                phase "device-pairing-approved"
              else
                append_pairing_log "devices-approve-failed stdout" "$RUNNER_TEMP/device-approve.stdout"
                append_pairing_log "devices-approve-failed stderr" "$RUNNER_TEMP/device-approve.stderr"
                return 1
              fi
            done
          }

          approve_pending_nodes() {
            local output="$RUNNER_TEMP/nodes.json"
            local stderr="$RUNNER_TEMP/nodes.stderr"
            local request_ids="$RUNNER_TEMP/node-request-ids.txt"
            if ! openclaw nodes pending --json \
              --url "ws://127.0.0.1:${GATEWAY_PORT}" \
              --token "$PROOF_TOKEN" >"$output" 2>"$stderr"; then
              append_pairing_log "nodes-pending-failed stdout" "$output"
              append_pairing_log "nodes-pending-failed stderr" "$stderr"
              return 1
            fi
            append_pairing_log "nodes-pending-ok stdout" "$output"
            append_pairing_log "nodes-pending-ok stderr" "$stderr"
            NODES_JSON="$output" node <<'NODE' >"$request_ids"
          const fs = require("node:fs");
          const value = JSON.parse(fs.readFileSync(process.env.NODES_JSON, "utf8"));
          const pending = Array.isArray(value) ? value : (value.pending ?? []);
          for (const request of pending) {
            if (typeof request.requestId === "string") console.log(request.requestId);
          }
          NODE
            [[ -s "$request_ids" ]] || return 1
            while IFS= read -r request_id; do
              phase "node-pairing-request-observed"
              if openclaw nodes approve "$request_id" \
                --url "ws://127.0.0.1:${GATEWAY_PORT}" \
                --token "$PROOF_TOKEN" >"$RUNNER_TEMP/node-approve.stdout" 2>"$RUNNER_TEMP/node-approve.stderr"; then
                append_pairing_log "nodes-approve-ok stdout" "$RUNNER_TEMP/node-approve.stdout"
                append_pairing_log "nodes-approve-ok stderr" "$RUNNER_TEMP/node-approve.stderr"
                phase "node-pairing-approved"
              else
                append_pairing_log "nodes-approve-failed stdout" "$RUNNER_TEMP/node-approve.stdout"
                append_pairing_log "nodes-approve-failed stderr" "$RUNNER_TEMP/node-approve.stderr"
                return 1
              fi
            done <"$request_ids"
          }

          wait_tcp() {
            local host="$1"
            local port="$2"
            local timeout_seconds="${3:-120}"
            local deadline=$((SECONDS + timeout_seconds))
            while (( SECONDS < deadline )); do
              if (echo >/dev/tcp/"$host"/"$port") >/dev/null 2>&1; then return 0; fi
              sleep 2
            done
            return 1
          }

          cleanup() {
            set +e
            if [[ -n "$transcript_backup" && -f "$transcript_backup" && -n "$transcript_path" ]]; then
              mv "$transcript_backup" "$transcript_path"
            fi
            adb shell pkill -INT screenrecord >/dev/null 2>&1 || true
            if [[ -n "$screenrecord_pid" ]]; then wait "$screenrecord_pid" 2>/dev/null || true; fi
            adb pull /sdcard/pr122200-proof.mp4 "$ARTIFACT_DIR/pr122200-proof.mp4" >/dev/null 2>&1 || true
            if [[ "$session_label_redacted" == true ]]; then
              adb exec-out screencap -p >"$ARTIFACT_DIR/final-state.png" 2>/dev/null || true
            fi
            adb shell uiautomator dump /sdcard/final-window.xml >/dev/null 2>&1 || true
            adb exec-out cat /sdcard/final-window.xml >"$RUNNER_TEMP/final-window.xml" 2>/dev/null || true
            redact_file "$RUNNER_TEMP/final-window.xml" "$ARTIFACT_DIR/final-window.xml"
            app_pid="$(adb shell pidof ai.openclaw.app 2>/dev/null | tr -d '\r' | awk '{ print $1 }')"
            if [[ -n "$app_pid" ]]; then
              adb logcat -d --pid="$app_pid" \
                -s 'OpenClawRuntime:V' 'AndroidRuntime:E' 'System.err:W' '*:S' \
                >"$RUNNER_TEMP/logcat-raw.txt" 2>/dev/null || true
            else
              printf '%s\n' "OpenClaw app PID unavailable during cleanup" >"$RUNNER_TEMP/logcat-raw.txt"
            fi
            redact_file "$RUNNER_TEMP/logcat-raw.txt" "$ARTIFACT_DIR/android-logcat-redacted.txt"
            redact_file "$RUNNER_TEMP/gateway-raw.log" "$ARTIFACT_DIR/gateway-redacted.log"
            redact_file "$RUNNER_TEMP/mock-raw.log" "$ARTIFACT_DIR/mock-redacted.log"
            redact_file "$RUNNER_TEMP/pairing-orchestration-raw.log" "$ARTIFACT_DIR/pairing-orchestration-redacted.log"
            redact_file "$RUNNER_TEMP/emulator-raw.log" "$ARTIFACT_DIR/emulator-redacted.log"
            if [[ -f "$RUNNER_TEMP/mock-requests.jsonl" ]]; then
              MOCK_REQUESTS="$RUNNER_TEMP/mock-requests.jsonl" node <<'NODE' >"$ARTIFACT_DIR/mock-request-summary.txt" || true
          const fs = require("node:fs");
          const lines = fs.readFileSync(process.env.MOCK_REQUESTS, "utf8").trim().split(/\n/u).filter(Boolean);
          console.log(`request_count=${lines.length}`);
          for (const [index, line] of lines.entries()) {
            const entry = JSON.parse(line);
            console.log(`${index + 1}: ${entry.method ?? "?"} ${entry.path ?? "?"}`);
          }
          NODE
            fi
            [[ -n "$gateway_pid" ]] && kill "$gateway_pid" >/dev/null 2>&1 || true
            [[ -n "$mock_pid" ]] && kill "$mock_pid" >/dev/null 2>&1 || true
            adb emu kill >/dev/null 2>&1 || true
            [[ -n "$emulator_pid" ]] && kill "$emulator_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          phase "proof-step-started"

          if [[ ! -c /dev/kvm ]]; then
            echo "/dev/kvm is unavailable" >&2
            exit 1
          fi
          sudo chown root:kvm /dev/kvm
          sudo chmod 666 /dev/kvm
          sudo usermod -aG kvm "$USER" || true
          test -r /dev/kvm -a -w /dev/kvm

          android_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager_bin="$(find "$android_sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' -print | sort | tail -1)"
          test -x "$sdkmanager_bin"
          avdmanager_bin="$(dirname "$sdkmanager_bin")/avdmanager"
          test -x "$avdmanager_bin"
          export PATH="$android_sdk_root/platform-tools:$android_sdk_root/emulator:$(dirname "$sdkmanager_bin"):$PATH"
          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          "$sdkmanager_bin" "platform-tools" "emulator" "$SYSTEM_IMAGE"
          phase "android-sdk-ready"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/pr122200-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | "$avdmanager_bin" create avd \
            --force \
            --name "$AVD_NAME" \
            --package "$SYSTEM_IMAGE" \
            --device pixel_6
          emulator_bin="$android_sdk_root/emulator/emulator"
          test -x "$emulator_bin"
          "$emulator_bin" -list-avds | tee "$ARTIFACT_DIR/available-avds.txt"
          grep -Fxq "$AVD_NAME" "$ARTIFACT_DIR/available-avds.txt"
          phase "avd-created"
          nohup "$emulator_bin" \
            -avd "$AVD_NAME" \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-snapshot \
            -wipe-data \
            >"$RUNNER_TEMP/emulator-raw.log" 2>&1 &
          emulator_pid=$!
          phase "emulator-launched"
          adb start-server
          device_deadline=$((SECONDS + 180))
          until adb devices | awk 'NR > 1 && $2 == "device" { found = 1 } END { exit(found ? 0 : 1) }'; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              wait "$emulator_pid" || true
              echo "Emulator exited before adb came online" >&2
              exit 1
            fi
            if (( SECONDS >= device_deadline )); then
              echo "Timed out waiting for adb device" >&2
              exit 1
            fi
            sleep 2
          done
          phase "adb-device-online"
          boot_deadline=$((SECONDS + 240))
          until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; do
            if (( SECONDS >= boot_deadline )); then
              echo "Emulator boot timed out" >&2
              exit 1
            fi
            sleep 2
          done
          phase "android-boot-complete"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell input keyevent 82

          npm install --global "openclaw@${GATEWAY_VERSION}"
          openclaw --version >"$ARTIFACT_DIR/gateway-version.txt"

          success_marker="$(node -e 'process.stdout.write("PR122200_FULL_MESSAGE_START\\n" + "A".repeat(9000) + "\\nPR122200_FULL_MESSAGE_END")')"
          SUCCESS_MARKER="$success_marker" \
            MOCK_PORT="$MOCK_PORT" \
            MOCK_REQUEST_LOG="$RUNNER_TEMP/mock-requests.jsonl" \
            node scripts/e2e/mock-openai-server.mjs >"$RUNNER_TEMP/mock-raw.log" 2>&1 &
          mock_pid=$!
          wait_tcp 127.0.0.1 "$MOCK_PORT" 60

          WORKSPACE_DIR="$workspace_dir" node <<'NODE'
          const fs = require("node:fs");
          const config = {
            gateway: {
              mode: "local",
              port: Number(process.env.GATEWAY_PORT),
              bind: "loopback",
              auth: { mode: "token", token: process.env.PROOF_TOKEN },
              controlUi: { enabled: false },
              nodes: {
                pairing: { autoApproveCidrs: ["127.0.0.1/32", "::1/128"] },
              },
            },
            models: {
              mode: "merge",
              providers: {
                openai: {
                  baseUrl: `http://127.0.0.1:${process.env.MOCK_PORT}/v1`,
                  apiKey: { source: "env", provider: "default", id: "OPENAI_API_KEY" },
                  api: "openai-responses",
                  agentRuntime: { id: "openclaw" },
                  request: { allowPrivateNetwork: true },
                  models: [
                    {
                      id: "pr122200-proof",
                      name: "PR 122200 proof",
                      api: "openai-responses",
                      agentRuntime: { id: "openclaw" },
                      reasoning: false,
                      input: ["text"],
                      cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 },
                      contextWindow: 128000,
                      contextTokens: 96000,
                      maxTokens: 12000,
                    },
                  ],
                },
              },
            },
            agents: {
              defaults: {
                model: { primary: "openai/pr122200-proof" },
                models: {
                  "openai/pr122200-proof": {
                    agentRuntime: { id: "openclaw" },
                    params: { transport: "sse", openaiWsWarmup: false },
                  },
                },
                workspace: process.env.WORKSPACE_DIR,
                skipBootstrap: true,
              },
            },
            plugins: { enabled: true },
          };
          fs.writeFileSync(process.env.OPENCLAW_CONFIG_PATH, JSON.stringify(config, null, 2) + "\n", { mode: 0o600 });
          NODE

          openclaw gateway run --port "$GATEWAY_PORT" --bind loopback \
            >"$RUNNER_TEMP/gateway-raw.log" 2>&1 &
          gateway_pid=$!
          if ! wait_tcp 127.0.0.1 "$GATEWAY_PORT" 120; then
            redact_file "$RUNNER_TEMP/gateway-raw.log" "$ARTIFACT_DIR/gateway-start-failure.log"
            exit 1
          fi
          phase "released-gateway-ready"

          adb reverse "tcp:${GATEWAY_PORT}" "tcp:${GATEWAY_PORT}"
          apk_path="$(find apps/android/app/build/outputs/apk/play/debug -name '*.apk' -type f -print -quit)"
          test -n "$apk_path"
          adb install -r "$apk_path"
          sha256sum "$apk_path" >"$ARTIFACT_DIR/apk-sha256.txt"
          adb shell monkey -p ai.openclaw.app -c android.intent.category.LAUNCHER 1 >/dev/null

          tap_text "Continue" 90
          tap_text "Set up manually" 60
          type_into "Host" "127.0.0.1"
          type_into "18789" "$GATEWAY_PORT"
          adb shell input swipe 500 1500 500 500 300
          type_into "Paste token" "$PROOF_TOKEN"
          tap_text "Unencrypted" 60
          tap_text "Test connection" 60

          pairing_deadline=$((SECONDS + 180))
          while (( SECONDS < pairing_deadline )); do
            approve_pending_devices || true
            if ui_point "Retry connection" exact >/dev/null 2>&1; then
              tap_text "Retry connection" 30
              phase "device-pairing-retry-requested"
            fi
            if ui_point "Gateway paired" contains >/dev/null 2>&1; then break; fi
            sleep 2
          done
          wait_text "Gateway paired" 5 contains
          tap_text "Continue" 30

          if wait_text "Approve node access" 60 exact; then
            tap_text "I have approved" 30
            phase "node-approval-check-requested"
            waiting_dialog_deadline=$((SECONDS + 15))
            while (( SECONDS < waiting_dialog_deadline )); do
              if ui_point "Still waiting for approval" exact >/dev/null 2>&1; then
                tap_text "OK" 15
                phase "node-approval-wait-dismissed"
                break
              fi
              sleep 1
            done
            node_pair_deadline=$((SECONDS + 180))
            node_pair_approved=false
            while (( SECONDS < node_pair_deadline )); do
              approve_pending_devices || true
              if ui_point "Retry connection" exact >/dev/null 2>&1; then
                tap_text "Retry connection" 30
                phase "node-device-pairing-retry-requested"
              fi
              if approve_pending_nodes; then
                node_pair_approved=true
                break
              fi
              sleep 2
            done
            [[ "$node_pair_approved" == true ]]
            phase "node-access-approved"
            node_approval_ui_deadline=$((SECONDS + 30))
            node_approval_ui_handled=false
            while (( SECONDS < node_approval_ui_deadline )); do
              if ui_point "Permissions" exact >/dev/null 2>&1; then
                phase "permissions-auto-advanced"
                node_approval_ui_handled=true
                break
              fi
              if ui_point "I have approved" exact >/dev/null 2>&1; then
                tap_text "I have approved" 30
                phase "node-approval-confirmed"
                node_approval_ui_handled=true
                break
              fi
              sleep 2
            done
            [[ "$node_approval_ui_handled" == true ]]
          fi

          if wait_text "Permissions" 30 exact; then
            tap_text "Continue" 30
          fi
          ensure_chat
          phase "android-chat-ready"

          label_android_session
          adb shell am force-stop ai.openclaw.app
          adb shell monkey -p ai.openclaw.app -c android.intent.category.LAUNCHER 1 >/dev/null
          ensure_chat
          wait_text "PR 122200 proof" 60 exact

          type_into "Message OpenClaw" "PR122200_PROOF_REQUEST"
          tap_text "Send" 60
          transcript_deadline=$((SECONDS + 120))
          while (( SECONDS < transcript_deadline )); do
            transcript_path="$(
              find "$OPENCLAW_STATE_DIR/agents" -type f -name '*.jsonl' -print0 \
                | xargs -0 -r grep -l -m1 'PR122200_FULL_MESSAGE_START' \
                | head -1 \
                || true
            )"
            if [[ -n "$transcript_path" ]]; then break; fi
            sleep 2
          done
          test -n "$transcript_path"
          phase "full-message-transcript-persisted"

          adb shell am force-stop ai.openclaw.app
          adb shell monkey -p ai.openclaw.app -c android.intent.category.LAUNCHER 1 >/dev/null
          ensure_chat
          wait_text "View all" 120 exact

          adb shell screenrecord --time-limit 180 /sdcard/pr122200-proof.mp4 \
            >"$RUNNER_TEMP/screenrecord.log" 2>&1 &
          screenrecord_pid=$!

          screenshot "01-preview-view-all.png"
          phase "preview-captured"

          tap_text "View all" 30
          wait_text "Close" 120 exact
          screenshot "02-expanded.png"
          phase "expanded-captured"

          tap_text "Close" 30
          wait_text "View all" 60 exact
          screenshot "03-collapsed.png"
          phase "collapsed-captured"

          adb shell am force-stop ai.openclaw.app
          adb shell monkey -p ai.openclaw.app -c android.intent.category.LAUNCHER 1 >/dev/null
          ensure_chat
          wait_text "View all" 120 exact
          transcript_backup="${transcript_path}.proof-backup"
          mv "$transcript_path" "$transcript_backup"

          tap_text "View all" 30
          wait_text "Retry" 120 exact
          screenshot "04-failed-request-retryable.png"
          phase "retryable-failure-captured"

          mv "$transcript_backup" "$transcript_path"
          transcript_backup=""
          tap_text "Retry" 30
          wait_text "Close" 120 exact
          screenshot "05-retry-success.png"
          phase "retry-success-captured"

          adb shell pkill -INT screenrecord >/dev/null 2>&1 || true
          wait "$screenrecord_pid" 2>/dev/null || true
          screenrecord_pid=""
          adb pull /sdcard/pr122200-proof.mp4 "$ARTIFACT_DIR/pr122200-proof.mp4" >/dev/null

          {
            echo "product_sha=$(git rev-parse HEAD)"
            echo "gateway_version=$(openclaw --version | tr -d '\r')"
            echo "android_release=$(adb shell getprop ro.build.version.release | tr -d '\r')"
            echo "android_sdk=$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
            echo "android_model=$(adb shell getprop ro.product.model | tr -d '\r')"
            adb shell dumpsys package ai.openclaw.app | sed -n '/versionCode=/p;/versionName=/p' | tr -d '\r'
            echo "proof_states=preview,expanded,collapsed,failed-request-retryable,retry-success"
            echo "gateway_contract=v${GATEWAY_VERSION} advertises and handles chat.message.get"
          } >"$ARTIFACT_DIR/proof-summary.txt"
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test -s "$ARTIFACT_DIR/01-preview-view-all.png"
          test -s "$ARTIFACT_DIR/02-expanded.png"
          test -s "$ARTIFACT_DIR/03-collapsed.png"
          test -s "$ARTIFACT_DIR/04-failed-request-retryable.png"
          test -s "$ARTIFACT_DIR/05-retry-success.png"

      - name: Upload redacted proof artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr122200-android-exact-head-proof
          path: ${{ runner.temp }}/pr122200-artifacts
          if-no-files-found: error
          retention-days: 30
