name: PR 122200 Android focused proof

on:
  push:
    branches:
      - proof/pr122200-android-4d-kvm

permissions: {}

concurrency:
  group: pr122200-android-proof
  cancel-in-progress: true

jobs:
  android-focused-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PRODUCT_SHA: bae10eb2c8d4a7336a5674aa453c1c70bf0ebc0f

    steps:
      - name: Check out exact product head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.PRODUCT_SHA }}
          persist-credentials: false

      - name: Set up Android toolchain
        uses: ./.github/actions/setup-android-toolchain

      - name: Set up repository toolchain
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.x"
          install-bun: "false"
          install-deps: "true"
          use-actions-cache: "false"

      - name: Verify native i18n baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          pnpm native:i18n:verify

      - name: Prove Gateway truncation contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          node scripts/run-vitest.mjs src/gateway/chat-display-projection.test.ts
          node scripts/run-vitest.mjs src/gateway/server.chat.gateway-server-chat-b.test.ts \
            -t 'chat.message.get (returns the full projected message|preserves a still-truncated projection state)'

      - name: Prove negotiated capability and disclosure states
        working-directory: apps/android
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          ./gradlew --no-daemon :app:testPlayDebugUnitTest \
            --tests 'ai.openclaw.app.GatewayChatMessageCapabilityTest.chatMessageGetCapabilityFailsClosedAcrossOldDisconnectAndReconnectMethodSets' \
            --tests 'ai.openclaw.app.chat.ChatControllerTranscriptCacheTest.truncatedAssistantMessageLoadsFullContentForItsCurrentOwner' \
            --tests 'ai.openclaw.app.chat.ChatControllerTranscriptCacheTest.stillTruncatedFullMessageRemainsRetryable' \
            --tests 'ai.openclaw.app.chat.ChatControllerTranscriptCacheTest.markedAssistantMessageDoesNotRequestFullContentWhenGatewayMethodSupportIsRevoked' \
            --tests 'ai.openclaw.app.ui.chat.ChatScreenTest.assistantDisclosureCachesLoadedMessageAcrossCollapseAndReexpand' \
            --tests 'ai.openclaw.app.ui.chat.ChatScreenTest.assistantDisclosureFailureRemainsRetryable' \
            --tests 'ai.openclaw.app.ui.chat.ChatScreenTest.assistantDisclosureDoesNotCrossGatewaySessionAgentOrReconnectScope' \
            --tests 'ai.openclaw.app.ui.chat.ChatScreenTest.assistantDisclosureRequiresGatewayMethodSupport'

      - name: Verify exact head and eight passing Android tests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          results=apps/android/app/build/test-results/testPlayDebugUnitTest
          test -n "$(find "$results" -maxdepth 1 -name '*.xml' -print -quit)"
          ! grep -R -n -E '<failure|<error' "$results"
          for test_name in \
            chatMessageGetCapabilityFailsClosedAcrossOldDisconnectAndReconnectMethodSets \
            truncatedAssistantMessageLoadsFullContentForItsCurrentOwner \
            stillTruncatedFullMessageRemainsRetryable \
            markedAssistantMessageDoesNotRequestFullContentWhenGatewayMethodSupportIsRevoked \
            assistantDisclosureCachesLoadedMessageAcrossCollapseAndReexpand \
            assistantDisclosureFailureRemainsRetryable \
            assistantDisclosureDoesNotCrossGatewaySessionAgentOrReconnectScope \
            assistantDisclosureRequiresGatewayMethodSupport
          do
            grep -R -q "name=\"${test_name}\"" "$results"
          done
          echo "exact-head focused proof: 8 Android tests passed"

      - name: Upload focused test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr122200-android-focused-exact-head-proof
          path: apps/android/app/build/test-results/testPlayDebugUnitTest/*.xml
          if-no-files-found: error
          retention-days: 7
