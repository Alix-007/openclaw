name: PR 122200 Android emulator interaction proof

on:
  push:
    branches:
      - proof/pr122200-android-4d-kvm

permissions: {}

concurrency:
  group: pr122200-android-proof
  cancel-in-progress: true

jobs:
  android-emulator-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PRODUCT_SHA: 7b2dbbf4287b9cfebe58c1b0ffa02bacac092d75
      PROOF_SHA: ${{ github.sha }}

    steps:
      - name: Check out exact product head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.PRODUCT_SHA }}
          persist-credentials: false

      - name: Check out proof harness
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.PROOF_SHA }}
          path: proof-harness
          persist-credentials: false

      - name: Set up repository toolchain
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.x"
          install-bun: "false"
          install-deps: "true"
          use-actions-cache: "false"

      - name: Set up Android toolchain
        uses: ./.github/actions/setup-android-toolchain

      - name: Inject proof-only instrumentation source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git -C proof-harness rev-parse HEAD)" = "$PROOF_SHA"
          target=apps/android/app/src/androidTest/java/ai/openclaw/app/ui/chat/AssistantDisclosureInteractionProof.kt
          mkdir -p "$(dirname "$target")"
          cp proof-harness/.github/proof/pr122200/AssistantDisclosureInteractionProof.kt "$target"

      - name: Build exact-head app and proof APKs
        working-directory: apps/android
        shell: bash
        run: |
          set -euo pipefail
          timeout 720 ./gradlew --no-daemon \
            -PopenclawBuildCommit="$PRODUCT_SHA" \
            :app:assemblePlayDebug \
            :app:assemblePlayDebugAndroidTest

      - name: Enable KVM for the hosted emulator
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run one bounded emulator interaction proof
        id: proof
        uses: ReactiveCircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -euo pipefail
            artifact_dir="$RUNNER_TEMP/pr122200-emulator-proof"
            mkdir -p "$artifact_dir"

            test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"

            app_apk="$(find apps/android/app/build/outputs/apk/play/debug -name '*.apk' -type f -print -quit)"
            test_apk="$(find apps/android/app/build/outputs/apk/androidTest/play/debug -name '*.apk' -type f -print -quit)"
            test -n "$app_apk"
            test -n "$test_apk"
            adb install -r "$app_apk"
            adb install -r "$test_apk"

            set +e
            timeout 240 adb shell am instrument -w -r \
              -e class ai.openclaw.app.ui.chat.AssistantDisclosureInteractionProof \
              ai.openclaw.app.test/androidx.test.runner.AndroidJUnitRunner \
              | tee "$artifact_dir/instrumentation.txt"
            test_status="${PIPESTATUS[0]}"
            set -e
            test "$test_status" -eq 0
            grep -q '^OK (1 test)' "$artifact_dir/instrumentation.txt"
            adb pull /sdcard/Android/data/ai.openclaw.app/files/pr122200-proof/. "$artifact_dir/interaction/"

            for state in 01-preview 02-full 03-closed 04-retry 05-recovered; do
              test -s "$artifact_dir/interaction/$state.png"
              test -s "$artifact_dir/interaction/$state.xml"
            done
            grep -q 'View all' "$artifact_dir/interaction/01-preview.xml"
            grep -q 'Close' "$artifact_dir/interaction/02-full.xml"
            grep -q 'View all' "$artifact_dir/interaction/03-closed.xml"
            grep -q 'Retry' "$artifact_dir/interaction/04-retry.xml"
            grep -q 'Close' "$artifact_dir/interaction/05-recovered.xml"
            text_artifacts=("$artifact_dir/instrumentation.txt" "$artifact_dir"/interaction/*.xml)
            ! rg -n -i \
              'token|public.?key|private.?key|device.?id|node.?id|credential|authorization|bearer|adbkey' \
              "${text_artifacts[@]}"
            ! rg -n -e '\b[[:xdigit:]]{64}\b' -e '[A-Za-z0-9+/=_-]{80,}' "${text_artifacts[@]}"
            {
              echo "product_sha=$PRODUCT_SHA"
              echo "proof_sha=$PROOF_SHA"
              echo "emulator=true"
              echo "states=preview,full,closed,retry,recovered"
              echo "instrumentation=OK (1 test)"
            } >"$artifact_dir/manifest.txt"
            (
              cd "$artifact_dir"
              find interaction -type f -print0 | sort -z | xargs -0 sha256sum >sha256sums.txt
            )

      - name: Upload redacted emulator interaction proof
        if: steps.proof.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr122200-android-emulator-interaction-exact-head
          path: ${{ runner.temp }}/pr122200-emulator-proof
          if-no-files-found: error
          retention-days: 7
