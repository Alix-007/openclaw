name: Cron timestamp parent-red proof
on:
  push:
    branches: [proof/alix-cron-timestamp-parent-20260908]
  workflow_dispatch:
permissions:
  contents: read
env:
  PRODUCT_SHA: 59f57f3cc5fa4beaba0d2f08bcc7e5ed3d947b3e
  EXPECTATION_MODE: parent
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.16.0
      - name: Materialize exact source and install without hooks
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/product" "$RUNNER_TEMP/cron-timestamp"
          git fetch --no-tags --depth=1 https://github.com/openclaw/openclaw.git "$PRODUCT_SHA"
          actual_sha=$(git rev-parse 'FETCH_HEAD^{commit}')
          test "$actual_sha" = "$PRODUCT_SHA"
          git archive "$actual_sha" | tar -xf - -C "$RUNNER_TEMP/product"
          printf 'expected=%s\nactual=%s\n' "$PRODUCT_SHA" "$actual_sha" > "$RUNNER_TEMP/cron-timestamp/HEADS.txt"
          corepack enable
          cd "$RUNNER_TEMP/product"
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Real service and file transport
        run: bash .github/pr-proof/run-cron-timestamp-parent-red.sh "$RUNNER_TEMP/product" "$PRODUCT_SHA" "$RUNNER_TEMP/cron-timestamp"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cron-timestamp-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cron-timestamp
          if-no-files-found: error
          retention-days: 7
