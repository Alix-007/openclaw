name: Message id literal code product proof
on:
  push:
    branches: [proof/alix-message-id-product-20260908]
  workflow_dispatch:
permissions:
  contents: read
env:
  PRODUCT_SHA: dee8d07bbc2f2a5f7064473112189def3e9aecff
jobs:
  proof:
    if: github.repository == 'Alix-007/openclaw'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.16.0
      - name: Materialize exact product without account credentials
        run: |
          set -euo pipefail
          product_root="$RUNNER_TEMP/openclaw-product"
          mkdir -p "$product_root"
          git fetch --no-tags --depth=1 https://github.com/Alix-007/openclaw.git "$PRODUCT_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$PRODUCT_SHA"
          git archive "$PRODUCT_SHA" | tar -xf - -C "$product_root"
          corepack enable
          cd "$product_root"
          unset GH_TOKEN GITHUB_TOKEN NODE_AUTH_TOKEN NPM_TOKEN
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Focused message-id sanitizer tests
        working-directory: ${{ runner.temp }}/openclaw-product
        run: node scripts/run-vitest.mjs run src/shared/chat-envelope.test.ts src/shared/text/message-id-hints.test.ts src/gateway/chat-sanitize.test.ts src/gateway/control-ui-public-session-render.test.ts
      - name: Isolated SDK module identity regression
        working-directory: ${{ runner.temp }}/openclaw-product
        run: node scripts/run-vitest.mjs run src/state/openclaw-agent-db-module-identity.test.ts
      - name: Isolated plugin resolver packaging regression
        working-directory: ${{ runner.temp }}/openclaw-product
        run: pnpm test extensions/onepassword/src/secret-ref-resolver.test.ts
      - name: Build real Gateway without SDK declarations
        working-directory: ${{ runner.temp }}/openclaw-product
        run: pnpm build:docker
      - name: Real Gateway history and canonical transcript readback
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN NODE_AUTH_TOKEN NPM_TOKEN
          node "$GITHUB_WORKSPACE/.github/pr-proof/run-message-id-proof.mjs" \
            "$RUNNER_TEMP/openclaw-product" "$PRODUCT_SHA" \
            "$RUNNER_TEMP/message-id-receipts" product
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: message-id-product-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/message-id-receipts
          if-no-files-found: error
          retention-days: 7
