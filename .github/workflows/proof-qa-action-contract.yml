name: Logbook Snapshot Timeout Proof

run-name: Logbook real macOS snapshot timeout before/after proof

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Proof branch marker
        required: true
        default: proof/109042-screencapture-preflight
        type: string
      expected_sha:
        description: Candidate SHA marker
        required: false
        default: ""
        type: string
      qa_profile:
        description: Proof marker
        required: true
        default: logbook-snapshot-timeout
        type: string

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  macos-proof:
    name: ${{ matrix.name }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Baseline needs outer watchdog
            sha: 1b2598276ac1ceac826f2f7ba1172c157b66f30f
            expected: baseline
          - name: Candidate reaps stalled capture
            sha: aa7f5b03b8b03c515e28ea7a954cd1d509a9436d
            expected: candidate
    steps:
      - name: Checkout proof harness
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Checkout immutable product revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: Alix-007/openclaw
          ref: ${{ matrix.sha }}
          path: target
          persist-credentials: false

      - name: Install proof harness into immutable checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/.github/proof
          cp .github/proof/logbook-screencapture-timeout-proof.ts \
            target/.github/proof/logbook-screencapture-timeout-proof.ts

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.x"
          install-bun: "false"
          install-deps: "false"
          use-actions-cache: "false"

      - name: Install immutable product dependencies
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - name: Build immutable product revision
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          pnpm build

      - name: Run real Logbook node-host proof
        working-directory: target
        env:
          LOGBOOK_PROOF_EXPECT: ${{ matrix.expected }}
          LOGBOOK_PROOF_SHA: ${{ matrix.sha }}
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx .github/proof/logbook-screencapture-timeout-proof.ts

      - name: Record immutable revision
        if: always()
        working-directory: target
        env:
          EXPECTED_SHA: ${{ matrix.sha }}
          EXPECTED_OUTCOME: ${{ matrix.expected }}
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          {
            echo "### Logbook snapshot timeout proof"
            echo
            echo "- Product SHA: \`$actual_sha\`"
            echo "- Expected lane: \`$EXPECTED_OUTCOME\`"
            echo "- Host: \`$(sw_vers -productVersion)\`"
            echo "- Entry: real \`logbook.snapshot\` plugin node-host command handler"
            echo "- Capture executable: \`/usr/sbin/screencapture\`"
            echo "- Fault injection: targeted \`SIGSTOP\` of the observed direct capture child"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload proof diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: logbook-snapshot-timeout-${{ matrix.expected }}-${{ matrix.sha }}
          path: target/.artifacts/logbook-snapshot-timeout/
          if-no-files-found: error
          retention-days: 30
